# Pipeline configuration.
# Nothing here is hardcoded in the source files -- everything tunable lives in this one place.

data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race"          # excluded from model features, used only to audit fairness
  drop_columns: ["id", "decile_score", "score_text"]  # identifiers / COMPAS's own score, not our model's inputs

diagnostics:
  # Week 3's diagnosis, written down as cleaning rules. clean_dataset() reads this section;
  # the module knows the techniques, this section knows the dataset.
  placeholder_tokens: ["", "-", "?", "N/A", "NA", "n/a", "na", "nan"]
  # "nan" is in that list deliberately (week 4 fix): the category cleanup converts columns to
  # text before mapping, which turns a genuine NaN into the string "nan" -- a fake category that
  # would never be imputed or flagged. 229 c_charge_degree gaps were being lost this way.
  numeric_text_columns: ["priors_count", "prior_offenses"]  # load as text purely because of placeholders
  validity_rules:
    age: {min: 18, max: 100}
    decile_score: {min: 1, max: 10}
    juv_fel_count: {min: 0}
    priors_count: {min: 0, max: 60}
  canonical_categories:
    sex: {male: "Male", female: "Female"}
    race:
      african-american: "African-American"
      african american: "African-American"
      caucasian: "Caucasian"
      hispanic: "Hispanic"
      other: "Other"
      asian: "Asian"
      native american: "Native American"
    c_charge_degree: {f: "F", felony: "F", m: "M", misdemeanor: "M"}
    score_text: {low: "Low", medium: "Medium", high: "High"}
  redundant_columns: ["prior_offenses", "age_in_months", "juvenile_total"]  # r = 1.00 / caught by VIF
  id_column: "id"

preprocessing:
  # Encoder/scaler chosen by hand (week 4). Target encoding: compact and informative for the
  # categorical columns. Robust scaling: median/IQR, so the few extreme counts don't set the scale.
  # The alternatives (onehot/ordinal/count, none/standard/minmax) are one config change away.
  encoder: "target"
  scaler: "robust"
  random_state: 42        # the target encoder's internal cross-fitting folds
  numeric_features: ["age", "juv_fel_count", "juv_misd_count", "juv_other_count", "priors_count"]
  categorical_features: ["sex", "age_cat", "c_charge_degree"]
  mnar_indicator_sources: ["priors_count", "c_charge_degree"]   # MNAR -> fill AND flag
  imputation:
    numeric_strategy: "median"
    categorical_strategy: "most_frequent"

test_set:
  # Week 4: the FINAL TEST SET. Carved out once, stratified, and locked: never used to fit,
  # tune, compare or choose anything. Used only for the final assessment.
  # Do not change these two values after week 4 -- a new seed would silently give you a
  # different (already partly "seen") test set.
  size: 0.2
  random_state: 42

cv:
  # Week 4: how models are evaluated -- stratified k-fold cross-validation on the
  # development set (everything except the locked test set). Same random_state = same folds on
  # every run, for every model, so comparisons are like-for-like.
  n_splits: 5
  shuffle: true
  random_state: 42
  scoring: "accuracy"   # one metric for now, so numbers compare directly with weeks 2-3
  n_jobs: 1             # folds fitted in parallel; -1 = all cores (only pays off for slow models, e.g. random forest)

model:
  # Week 5: the decision tree again -- the model whose hyperparameters matter most. No max_depth
  # here any more: with tuning on, the search below chooses it.
  type: "decision_tree"   # "dummy" | "logistic_regression" | "decision_tree" | "random_forest"
  params:
    # params are passed straight to the model constructor, so they must match the chosen type.
    # logistic_regression -> max_iter: 2000
    # random_forest       -> n_estimators: 300, random_state: 42, n_jobs: -1
    # dummy               -> {} (predicts the majority class; the floor every model must beat)
    random_state: 42

tuning:
  # Week 5: hyperparameter tuning with Optuna (seeded TPE sampler), development set only. Every
  # candidate is the whole pipeline, scored by CV on the same folds; nested CV gives the honest
  # number. enabled: false = exactly the week 4 pipeline.
  enabled: true
  n_trials: 30
  n_splits: 5                                       # folds that score each candidate
  random_state: 42                                  # seeds the sampler and those folds
  # Keys are Pipeline parameter names. Types: int / float (low, high, log) or categorical (choices).
  # Only the space matching model.type is used.
  search_spaces:
    decision_tree:
      model__max_depth: {type: int, low: 1, high: 20}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__criterion: {type: categorical, choices: ["gini", "entropy"]}
    # Challenge 1: C is the inverse regularisation strength (smaller = stronger), so a log scale
    logistic_regression:
      model__C: {type: float, low: 0.0001, high: 100, log: true}
    # Challenge 2: every trial is ~100x a tree's cost -- set n_trials: 15 and cv.n_jobs: -1 to run it
    random_forest:
      model__n_estimators: {type: int, low: 50, high: 300}
      model__max_depth: {type: categorical, choices: [null, 3, 5, 8, 12, 20]}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__max_features: {type: categorical, choices: ["sqrt", "log2", 0.5, 1.0]}

output:
  results_dir: "results"   # each run's full report is saved here as a timestamped .txt file
