# Baseline pipeline configuration.
# Nothing here is hardcoded in the source files below -- everything tunable lives in this one place.

data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race"          # excluded from model features, used only to audit fairness
  drop_columns: ["id", "decile_score", "score_text", "prior_offenses", "age_in_months", "juvenile_total"]
  # identifiers / COMPAS's own score / the three redundant columns found via correlation + VIF
  diagnosis_path: "data/diagnosis_log.json"   # the EDA notebook's findings, read by clean_dataset

diagnostics:
  # Week 3. Keeps src/data_diagnostics.py generic -- the module knows the techniques,
  # this section knows the dataset.
  candidate_predictors: ["sex", "race", "age_cat", "c_charge_degree", "score_text"]
  validity_rules:
    age: "18 <= age <= 100"
    decile_score: "1 <= decile_score <= 10"
    juv_fel_count: "juv_fel_count >= 0"
    priors_count: "0 <= priors_count <= 60"
  id_column: "id"

preprocessing:
  # Week 3. Encoder/scaler pair chosen empirically: all 16 combinations scored with logistic
  # regression over 15 repeated 75/25 splits (see 02_preprocessing.ipynb, Step 4).
  # target + standard won at 0.6693 mean accuracy, but a paired comparison against the
  # runner-up (target + robust, also 0.6693) gives a difference of +0.0000 with SE 0.0002 --
  # within noise. The grid still picks one so the pipeline has a single answer.
  encoder: "target"
  scaler: "standard"
  imputation:
    # MCAR columns: simple fill, nothing to preserve. MNAR columns: fill AND flag, so the
    # model can still see that the value was missing (the flag is added before imputation).
    age: {strategy: median, indicator: false}
    juv_fel_count: {strategy: median, indicator: false}
    race: {strategy: most_frequent, indicator: false}
    sex: {strategy: most_frequent, indicator: false}
    priors_count: {strategy: median, indicator: true}
    c_charge_degree: {strategy: most_frequent, indicator: true}

split:
  test_size: 0.2
  random_state: 42

model:
  type: "decision_tree"   # "logistic_regression" or "decision_tree"
  params:
    # logistic_regression -> max_iter; decision_tree -> max_depth.
    max_depth: 5
    random_state: 42

output:
  results_dir: "results"   # each run's full report is saved here as a timestamped .txt file
